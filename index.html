<!DOCTYPE html>
<html lang="ar" dir="rtl" data-device="desktop">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="description" content="استعمالات الزمن للإدارة والأساتذة والتلاميذ — الثانوية الإعدادية سيدي عبد العزيز، وادي زم.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="استعمالات الزمن">
  <title>استعمالات الزمن — الثانوية الإعدادية سيدي عبد العزيز</title>
  <link rel="manifest" href="school-timetable.webmanifest">
  <link rel="icon" type="image/svg+xml" href="school-timetable-assets/app-icon.svg">
  <link rel="apple-touch-icon" href="school-timetable-assets/icon-192.png">
  <script>
    (() => {
      const touchTablet = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      const mobileAgent = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      const compactTouchScreen = matchMedia('(pointer: coarse)').matches && matchMedia('(max-width: 1024px)').matches;
      document.documentElement.dataset.device = mobileAgent || touchTablet || compactTouchScreen ? 'mobile' : 'desktop';
    })();
  </script>
  <style>
    @font-face { font-family: Tajawal; src: url('school-timetable-assets/tajawal-regular.ttf') format('truetype'); font-style: normal; font-weight: 400 500; font-display: swap; }
    @font-face { font-family: Tajawal; src: url('school-timetable-assets/tajawal-bold.ttf') format('truetype'); font-style: normal; font-weight: 600 900; font-display: swap; }
    :root { --ink: #152e47; --teal: #147d8c; --muted: #627387; --canvas: #f5f7fa; --border: #dfe7ef; --paper: #fff; color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: Tajawal, 'Segoe UI', Tahoma, Arial, sans-serif; line-height: 1.6; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    [hidden] { display: none !important; }
    .page { position: relative; width: min(1100px, calc(100% - 64px)); margin: 48px auto 28px; }
    .identity { text-align: center; }
    .ministry-logo { display: block; width: min(350px, 84%); height: auto; margin: 0 auto 24px; }
    .school-name { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.55; }
    .school-city { display: block; margin-top: 3px; color: var(--muted); font-size: 17px; font-weight: 400; }
    .intro { margin: 38px 0 28px; text-align: center; }
    .year { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 3px 14px; border-radius: 30px; color: var(--teal); background: #e6f5f7; font-size: 16px; font-weight: 700; }
    .year svg { width: 18px; height: 18px; }
    h1 { margin: 12px 0 2px; font-size: 40px; line-height: 1.35; font-weight: 800; letter-spacing: -.8px; }
    .intro p { margin: 0; color: var(--muted); font-size: 17px; }
    .services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .service { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 20px; min-width: 0; min-height: 238px; padding: 26px; color: inherit; text-decoration: none; background: var(--paper); border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 12px 30px -18px rgba(21,46,71,.18); transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    .role-icon { display: grid; flex: 0 0 auto; place-items: center; width: 66px; height: 66px; background: #eaf6f8; border-radius: 19px; }
    .role-icon svg { width: 39px; height: 39px; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .role-icon .accent { stroke: var(--teal); }
    .service-copy { min-width: 0; }
    .service h2 { margin: 0 0 2px; font-size: 25px; font-weight: 800; line-height: 1.4; }
    .service p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .arrow { position: absolute; inset-inline-end: 22px; bottom: 24px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: #f1f5f9; }
    .arrow svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--teal); outline-offset: 5px; }
    @media (hover: hover) { .service:hover { transform: translateY(-3px); border-color: #a9cbd3; box-shadow: 0 18px 34px -17px rgba(21,46,71,.24); } }
    footer { margin-top: 36px; color: var(--muted); text-align: center; font-size: 14px; }
    .footer-mark { display: block; width: 28px; height: 2px; margin: 0 auto 9px; border-radius: 10px; background: #b5c2d0; }
    .credit { display: block; margin-top: 8px; color: #788696; font-size: 12px; }
    .app-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 10px 0 0; }
    .utility-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 6px 12px; border: 1px solid #dde8ef; border-radius: 12px; color: #496078; background: rgba(255,255,255,.78); cursor: pointer; font-size: 13px; font-weight: 700; }
    .utility-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .status { margin: 14px 0 0; padding: 10px 14px; border-radius: 12px; color: #62522c; background: #fff8e9; border: 1px solid #eedfc1; font-size: 14px; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    dialog { width: min(380px, calc(100% - 36px)); padding: 26px; color: var(--ink); background: white; border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 25px 80px rgba(21,46,71,.2); }
    dialog::backdrop { background: rgba(15,35,52,.42); }
    dialog h2 { margin: 0 0 12px; font-size: 24px; }
    dialog p { color: var(--muted); font-size: 16px; }
    .dialog-close { width: 100%; min-height: 44px; margin-top: 12px; color: white; background: var(--ink); border: 0; border-radius: 12px; cursor: pointer; }
    html[data-device="mobile"] { background: var(--canvas); }
    html[data-device="mobile"] body { position: relative; min-height: 100vh; min-height: 100dvh; background: radial-gradient(ellipse at 0 23%, #edf4f9 0, transparent 37%), radial-gradient(ellipse at 100% 96%, #e9f2f8 0, transparent 35%), #f8fafc; }
    html[data-device="mobile"] .page { display: flex; flex-direction: column; width: min(100%, 520px); min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
    html[data-device="mobile"] .ministry-logo { width: min(282px, 88%); margin-bottom: 22px; }
    html[data-device="mobile"] .school-name { font-size: 18px; line-height: 1.5; }
    html[data-device="mobile"] .school-city { font-size: 16px; margin-top: 2px; }
    html[data-device="mobile"] .identity::after { content: ''; display: block; width: 34px; height: 3px; margin: 15px auto 0; border-radius: 10px; background: var(--teal); }
    html[data-device="mobile"] .intro { margin: 24px 0 23px; }
    html[data-device="mobile"] h1 { margin-top: 12px; font-size: 34px; }
    html[data-device="mobile"] .intro p { font-size: 16px; }
    html[data-device="mobile"] .services { grid-template-columns: 1fr; gap: 13px; }
    html[data-device="mobile"] .service { flex-direction: row; align-items: center; gap: 15px; min-height: 108px; padding: 17px 16px; padding-inline-end: 49px; border-radius: 22px; box-shadow: 0 14px 25px -17px rgba(27,54,81,.22); }
    html[data-device="mobile"] .role-icon { width: 62px; height: 66px; border-radius: 18px; }
    html[data-device="mobile"] .role-icon svg { width: 38px; height: 38px; }
    html[data-device="mobile"] .service h2 { font-size: 24px; }
    html[data-device="mobile"] .service p { font-size: 14px; }
    html[data-device="mobile"] .arrow { inset-inline-end: 13px; top: 50%; bottom: auto; width: 30px; height: 30px; transform: translateY(-50%); }
    html[data-device="mobile"] .arrow svg { width: 17px; height: 17px; }
    html[data-device="mobile"] footer { margin-top: auto; padding-top: 24px; font-size: 13px; }
    html[data-device="mobile"] .credit { font-size: 11px; margin-top: 6px; }
    @media (max-width: 760px) { html[data-device="desktop"] .page { width: calc(100% - 36px); margin-top: 30px; } html[data-device="desktop"] .services { grid-template-columns: 1fr; } html[data-device="desktop"] .service { min-height: 190px; } }
    @media (max-width: 360px) { html[data-device="mobile"] .school-name { font-size: 16px; } html[data-device="mobile"] .service { gap: 11px; } html[data-device="mobile"] .role-icon { width: 50px; height: 58px; } html[data-device="mobile"] .service p { font-size: 13px; } }
    @media (max-height: 740px) { html[data-device="mobile"] .page { padding-top: max(14px, env(safe-area-inset-top)); } html[data-device="mobile"] .ministry-logo { width: 244px; margin-bottom: 14px; } html[data-device="mobile"] .identity::after { margin-top: 10px; } html[data-device="mobile"] .intro { margin: 17px 0 18px; } html[data-device="mobile"] h1 { font-size: 30px; margin-top: 8px; } html[data-device="mobile"] .service { min-height: 94px; padding-top: 13px; padding-bottom: 13px; } html[data-device="mobile"] .role-icon { height: 58px; } html[data-device="mobile"] footer { padding-top: 16px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
    @media print { .app-actions, dialog, .status { display: none !important; } .page { width: 100%; margin: 0; } .service { box-shadow: none; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="identity">
      <img class="ministry-logo" src="school-timetable-assets/ministry-logo.png" width="1616" height="340" alt="المملكة المغربية — وزارة التربية الوطنية والتعليم الأولي والرياضة">
      <p class="school-name">الثانوية الإعدادية سيدي عبد العزيز<span class="school-city">وادي زم</span></p>
    </header>
    <section class="intro" aria-labelledby="page-title">
      <span class="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-11 4h2m3 0h2m-7 3h2"/></svg><bdi>2026 — 2027</bdi></span>
      <h1 id="page-title">استعمالات الزمن</h1>
      <p>اختر فضاءك للمتابعة</p>
    </section>
    <nav class="services" aria-label="فضاءات استعمالات الزمن">
      <a class="service" data-role="admin" href="https://urlr.me/9mj2AA" target="_blank" rel="noopener noreferrer" aria-label="الإدارة — جداول الأساتذة والأقسام، تفتح في نافذة جديدة">
        <span class="role-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 42V22h11v20m16 0V22h11v20M16 42V15l8-6 8 6v27M3 42h42M24 9V3h8v5h-8"/><path class="accent" d="M21 18h6m-6 7h6m-6 7h6M9 28h3m-3 7h3m24-7h3m-3 7h3"/><path d="M21 42v-5h6v5"/></svg></span>
        <div class="service-copy"><h2>الإدارة</h2><p>جداول الأساتذة والأقسام</p></div>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></span>
      </a>
      <a class="service" data-role="teacher" href="https://urlr.me/AJRwbg" target="_blank" rel="noopener noreferrer" aria-label="الأستاذ — جدول الأستاذ، يفتح في نافذة جديدة">
        <span class="role-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="13" cy="16" r="5"/><path d="M6 42V30c0-4 3-6 7-6 3 0 5 1 7 3l3 3 9-9 4 4-12 12-7-5v10Z"/><path class="accent" d="M23 18V7h21v23H34"/></svg></span>
        <div class="service-copy"><h2>الأستاذ</h2><p>جدول الأستاذ</p></div>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></span>
      </a>
      <a class="service" data-role="student" href="https://urlr.me/tZNRG7" target="_blank" rel="noopener noreferrer" aria-label="التلميذ — استعمال زمن القسم، يفتح في نافذة جديدة">
        <span class="role-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="11" r="7"/><path d="M12 26c1-4 5-6 12-6s11 2 12 6"/><path class="accent" d="M24 43c-5-5-11-7-18-7V23c7 0 13 2 18 7 5-5 11-7 18-7v13c-7 0-13 2-18 7Zm0-13v13"/></svg></span>
        <div class="service-copy"><h2>التلميذ</h2><p>استعمال زمن القسم</p></div>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></span>
      </a>
    </nav>
    <p class="status" id="network-status" role="status" hidden>أنت غير متصل. يلزم الاتصال لفتح استعمالات الزمن.</p>
    <p class="sr-only" id="app-status" role="status" aria-live="polite"></p>
    <footer>
      <span class="footer-mark" aria-hidden="true"></span>
      <span>خدمات المؤسسة</span>
      <div class="app-actions" id="app-actions" hidden>
        <button class="utility-button" id="fullscreen-button" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>ملء الشاشة</span></button>
        <button class="utility-button" id="install-button" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 6v8m-3-3 3 3 3-3m-4 8h2"/></svg><span>إضافة للهاتف</span></button>
      </div>
      <small class="credit">ذ. صالح العمراني</small>
    </footer>
  </main>
  <dialog id="install-help" aria-labelledby="install-title">
    <h2 id="install-title">إضافة للهاتف</h2>
    <p id="install-instructions"></p>
    <form method="dialog"><button class="dialog-close" type="submit">حسنًا</button></form>
  </dialog>
  <script>
    (() => {
      const isMobile = document.documentElement.dataset.device === 'mobile';
      const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const appMode = matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)');
      const actions = document.getElementById('app-actions');
      const fullscreenButton = document.getElementById('fullscreen-button');
      const installButton = document.getElementById('install-button');
      const status = document.getElementById('app-status');
      const help = document.getElementById('install-help');
      let installPrompt = null;
      const isInstalled = () => appMode.matches || navigator.standalone === true;
      const isFullscreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const canFullscreen = () => (document.fullscreenEnabled && typeof document.documentElement.requestFullscreen === 'function') || (document.webkitFullscreenEnabled && typeof document.documentElement.webkitRequestFullscreen === 'function');
      const refreshActions = () => {
        const showActions = isMobile && !isInstalled() && !isFullscreen();
        actions.hidden = !showActions;
        fullscreenButton.hidden = !showActions || !canFullscreen();
        installButton.hidden = !showActions;
      };
      const showHelp = (message, title = 'إضافة للهاتف') => {
        document.getElementById('install-title').textContent = title;
        document.getElementById('install-instructions').textContent = message;
        if (typeof help.showModal === 'function') help.showModal();
        else status.textContent = message;
      };
      fullscreenButton.addEventListener('click', async () => {
        if (!isMobile) return;
        try {
          if (typeof document.documentElement.requestFullscreen === 'function') await document.documentElement.requestFullscreen();
          else document.documentElement.webkitRequestFullscreen();
          refreshActions();
        } catch (_) {
          showHelp('يمكنك فتح الواجهة دون شريط المتصفح بإضافتها إلى الشاشة الرئيسية ثم فتحها من أيقونتها.', 'عرض التطبيق');
        }
      });
      window.addEventListener('beforeinstallprompt', event => {
        if (!isMobile) return;
        event.preventDefault();
        installPrompt = event;
        refreshActions();
      });
      installButton.addEventListener('click', async () => {
        if (installPrompt) {
          const prompt = installPrompt;
          installPrompt = null;
          try {
            await prompt.prompt();
            await prompt.userChoice;
          } catch (_) {
            showHelp('من قائمة المتصفح اختر تثبيت التطبيق أو إضافته إلى الشاشة الرئيسية.');
          }
          refreshActions();
          return;
        }
        if (location.protocol === 'file:' || !window.isSecureContext) {
          showHelp('لإضافة التطبيق، افتح نسخة الموقع عبر رابط HTTPS، ثم اختر إضافته إلى الشاشة الرئيسية من قائمة المتصفح.');
        } else if (isAppleMobile) {
          showHelp('افتح الموقع في Safari، واضغط زر المشاركة، ثم اختر «إضافة إلى الشاشة الرئيسية». بعد ذلك افتح التطبيق من أيقونته.');
        } else {
          showHelp('من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»، ثم افتحه من أيقونته لعرضه كتطبيق.');
        }
      });
      window.addEventListener('appinstalled', () => { installPrompt = null; actions.hidden = true; });
      document.addEventListener('fullscreenchange', refreshActions);
      document.addEventListener('webkitfullscreenchange', refreshActions);
      if (typeof appMode.addEventListener === 'function') appMode.addEventListener('change', refreshActions);
      else if (typeof appMode.addListener === 'function') appMode.addListener(refreshActions);
      const refreshNetwork = () => { document.getElementById('network-status').hidden = navigator.onLine; };
      window.addEventListener('online', refreshNetwork);
      window.addEventListener('offline', refreshNetwork);
      document.querySelectorAll('.service').forEach(link => {
        link.addEventListener('click', event => {
          if (!navigator.onLine) {
            event.preventDefault();
            refreshNetwork();
            status.textContent = 'يلزم الاتصال بالإنترنت لفتح استعمالات الزمن.';
          }
        });
      });
      refreshActions();
      refreshNetwork();
      if ('serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./school-timetable-sw.js', { scope: './' }).catch(error => {
            console.warn('تعذر تفعيل العرض دون اتصال:', error);
          });
        });
      }
    })();
  </script>
</body>
</html>
